name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Regenerate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Rename APK with Version
      id: apk_info
      run: |
        VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="1.0"
        fi
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${{ github.ref_name }}"
          APK_NAME="Ako-${TAG_NAME}.apk"
        else
          APK_NAME="Ako-v${VERSION_NAME}.apk"
        fi
        
        mkdir -p build-output
        cp app/build/outputs/apk/debug/*.apk "build-output/${APK_NAME}"
        echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
        echo "apk_path=build-output/${APK_NAME}" >> $GITHUB_OUTPUT

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ako-v${{ steps.apk_info.outputs.version }}
        path: ${{ steps.apk_info.outputs.apk_path }}

    - name: Publish to GitHub Releases
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.apk_info.outputs.apk_path }}
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Ako v{0}', steps.apk_info.outputs.version) }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
